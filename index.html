<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LearnLabs</title>
    <link id="styleSheet" rel="stylesheet" href="darkmode.css">
</head>
<body>
    <div id="card">
        <img src="./images/learnlabslogo.png" alt="LearnLabs Logo">
        <button id="goto-login">LOGIN</button>
    </div>
    <script>
        const originalLog =console.log;
console.log = (...args) => {
  const now = new Date();
  const dateStr = now.toLocaleString('en-GB', {
    weekday: 'short',   
    year: 'numeric',
    month: 'short',     
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,     
    timeZone: 'Europe/Warsaw'
  }).replace(',', '');
  originalLog(`[${now}]`, ...args);
}

        let login = document.getElementById('goto-login');
        login.onclick = () => {
            window.open('login.html', '_self');
            document.documentElement.requestFullscreen();
        };        
    </script>
</body>
</html>
