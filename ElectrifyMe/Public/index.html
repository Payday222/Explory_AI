<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Ubuntu', sans-serif;
            text-align: center;

        button {
            padding: 16px 128px;

        button:hover {
            background-color: #5a5a5a;
            transform: translateY(-20%);

            transition: all 0.1s ease-in-out;
        }

            color: #e0e0e0;
        }

</head>
<body>
    <h1>Welcome to LearnLabs.AI Class</h1>
    <button onclick="OpenFullScreenWindow('host.html')">Host a Room</button>
    <button onclick="OpenFullScreenWindow('client.html')">Join a Room</button>
</body>

<script>

    const originalLog =console.log;
console.log = (...args) => {
  const now = new Date();
  const dateStr = now.toLocaleString('en-GB', {
    weekday: 'short',   
    year: 'numeric',
    month: 'short',     
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,     
    timeZone: 'Europe/Warsaw'
  }).replace(',', '');
  originalLog(`[${now}]`, ...args);
}


    function OpenFullScreenWindow(link) {
        const screenHeight = screen.availHeight;
        const screenWidth = screen.availWidth;
        const newWindow = window.open(
            `${link}`,
            '_blank',
            `width=${screenWidth},height=${screenHeight},top=0,left=0`
        );

        newWindow.focus();
    }
</script>
