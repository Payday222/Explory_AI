<!DOCTYPE html>
<head>
    <title>LearnLabs - Study Mode</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>

    <style>

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        button {
            background-color: #1f1f1f;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #333333;
        }

        h3, h4 {
            color: #ffffff;
        }

        .flashcard-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flip {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            background-color: #1e1e1e;
            color: #ffffff;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background-color: #2a2a5e;
        }

        #flashcard-wrapper {
            margin-top: 20px;
        }

        #error-popup {
            display: none;
            background-color: #ffcccc;
            color: #660000;
            padding: 20px;
            border-radius: 15px;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h3> Study Mode</h3><br>

<h4>Please select your preffered learniing method</h4><br>

<button id="flashcards">Flashcards</button>
<button id="article">Article</button>
<button>UNDER CONSTRUCTION</button>
<div id="error-popup"></div>
<div id="flashcard-wrapper"></div>
<div style="text-align: center; margin-top: 20px;">
    <button id="prev-card">Previous</button>
    <button id="next-card">Next</button>
</div>

</body>

</html>

<script>
    //!open this scipt in localhost
    document.getElementById('flashcards').addEventListener('click', () => {
        
    const socket = io('http://188.127.1.110:3007');
    socket.on('connect', () => {
        console.log('study.html connected to botSocket');
    });

    
        const test = localStorage.test;
        console.log('data from localstorage: ', test);
        socket.emit('generateFlashcards', test);

        socket.on('flashcardsGenerated', (cards) => {
            console.log("flashcards received: ", cards);

            if(!cards || cards.length === 0) {
                const test = localStorage.test;
                socket.emit('generateFlashcards', test);
                document.getElementById('error-popup').style.display = 'block';
                //or just emit generateflashcards again

            }

            const wrapper = document.getElementById('flashcard-wrapper');
            wrapper.innerHTML = ''; // Clear previous cards
          
            let currentCardIndex = 0;
            let currentCardEl;
          
            function renderCard(index) {
              wrapper.innerHTML = '';
          
              const [front, back] = cards[index];
              const container = document.createElement('div');
              container.className = 'flashcard-container';
          
              const card = document.createElement('div');
              card.className = 'flashcard';
          
              const frontFace = document.createElement('div');
              frontFace.className = 'flashcard-face flashcard-front';
              frontFace.textContent = front;
          
              const backFace = document.createElement('div');
              backFace.className = 'flashcard-face flashcard-back';
              backFace.textContent = back;
          
              card.appendChild(frontFace);
              card.appendChild(backFace);
              container.appendChild(card);
              wrapper.appendChild(container);
          
              card.addEventListener('click', () => {
                card.classList.toggle('flip');
              });
          
              currentCardEl = card;
            }
          
            // Initial render
            renderCard(currentCardIndex);
          
            // Navigation
            document.getElementById('next-card').onclick = () => {
              if (currentCardIndex < cards.length - 1) {
                currentCardIndex++;
                renderCard(currentCardIndex);
              }
            };
          
            document.getElementById('prev-card').onclick = () => {
              if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCard(currentCardIndex);
              }
            };
          });
        });

    //keyboard support cuz its cool
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
            document.getElementById('next-card').click();
        } else if (e.key === 'ArrowLeft') {
            document.getElementById('prev-card').click();
        }
    });

    document.getElementById('article').addEventListener('click', () => {
        socket.on('connect', () => {
            console.log('Socket connected to study');
        });

        let test = localStorage.test;
        socket.emit('GenerateArticle', test, this.socket.id);
        socket.on('ArticleGenerated', (article) => {
            const displaydiv = document.getElementById('flashcard-wrapper');
            displaydiv.innerText = article;
        });
        
    });
</script>
